<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Web 测试演示页</title>
<style>
  body { font-family: "Microsoft YaHei", Arial, sans-serif; margin: 0; padding: 24px;
         background: #f5f7f7; color: #22333b; }
  h1 { color: #16697A; font-size: 20px; margin: 0 0 4px; }
  .hint { color: #647878; font-size: 13px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #dde5e5; border-radius: 6px;
          padding: 16px; margin-bottom: 16px; max-width: 520px; }
  .row { margin-bottom: 12px; }
  label { display: block; font-size: 13px; margin-bottom: 4px; color: #46626a; }
  input { width: 100%; box-sizing: border-box; padding: 7px 9px;
          border: 1px solid #cfdcdc; border-radius: 4px; font-size: 14px; }
  button { background: #16697A; color: #fff; border: 0; border-radius: 4px;
           padding: 8px 18px; font-size: 14px; cursor: pointer; }
  button:hover { background: #125665; }
  #welcome { margin-top: 12px; font-size: 15px; color: #16697A; font-weight: bold;
             min-height: 20px; }
  #status { display: inline-block; padding: 2px 10px; border-radius: 10px;
            background: #e6f2f0; color: #16697A; font-size: 13px; }
  .spacer { height: 900px; }
  iframe { width: 100%; height: 90px; border: 1px dashed #cfdcdc; border-radius: 4px; }
</style>
</head>
<body>

<h1>Web 测试演示页</h1>
<p class="hint">本页由后端静态托管（/api/demo/），专供自动化验收使用，不依赖任何外部资源。</p>

<div class="card">
  <div class="row">
    <label for="username">用户名</label>
    <input id="username" type="text" placeholder="请输入用户名">
  </div>
  <div class="row">
    <label for="password">密码</label>
    <input id="password" type="password" placeholder="请输入密码">
  </div>
  <button id="login-btn" type="button">登录</button>
  <div id="welcome"></div>
</div>

<div class="card">
  <div class="row">
    <label>状态</label>
    <span id="status">ready</span>
  </div>
  <div class="row">
    <label for="city">城市（用于「清空输入」）</label>
    <input id="city" type="text" value="北京">
  </div>
  <div id="hidden" style="display:none">这一块默认不可见，用于「断言-元素可见」的反例</div>
</div>

<div class="card">
  <div class="row">
    <label>IFrame</label>
    <iframe id="frame" srcdoc="&lt;html&gt;&lt;body style='font-family:sans-serif'&gt;&lt;div id='inner'&gt;iframe 内部文本&lt;/div&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
  </div>
  <div class="row">
    <label>新窗口</label>
    <a id="newlink" href="/api/demo/popup.html" target="_blank">打开新窗口</a>
  </div>
</div>

<div class="spacer">（下方留白，用于验证「滚动到元素」）</div>
<div id="bottom" class="card">页面底部（滚动目标）</div>

<script>
  // 全页唯一的动态行为：点登录按钮，把欢迎语写进 #welcome。
  // 验收脚本靠它验证 input → click → extract_variable 的链路。
  document.getElementById('login-btn').addEventListener('click', function () {
    var name = document.getElementById('username').value;
    document.getElementById('welcome').innerText = '欢迎 ' + name;
  });
</script>

</body>
</html>
