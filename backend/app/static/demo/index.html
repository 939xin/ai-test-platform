<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Web 测试演示页</title>
<style>
  body { font-family: "Microsoft YaHei", Arial, sans-serif; margin: 0; padding: 24px;
         background: #f5f7f7; color: #22333b; }
  h1 { color: #16697A; font-size: 20px; margin: 0 0 4px; }
  h2 { color: #16697A; font-size: 15px; margin: 0 0 12px; }
  .hint { color: #647878; font-size: 13px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #dde5e5; border-radius: 6px;
          padding: 16px; margin-bottom: 16px; max-width: 680px; }
  .row { margin-bottom: 12px; }
  label { display: block; font-size: 13px; margin-bottom: 4px; color: #46626a; }
  input, select { box-sizing: border-box; padding: 7px 9px;
          border: 1px solid #cfdcdc; border-radius: 4px; font-size: 14px; }
  input[type=text], input[type=password] { width: 100%; }
  button { background: #16697A; color: #fff; border: 0; border-radius: 4px;
           padding: 8px 18px; font-size: 14px; cursor: pointer; margin-right: 6px; }
  button:hover { background: #125665; }
  #welcome { margin-top: 12px; font-size: 15px; color: #16697A; font-weight: bold;
             min-height: 20px; }
  #status { display: inline-block; padding: 2px 10px; border-radius: 10px;
            background: #e6f2f0; color: #16697A; font-size: 13px; }
  .spacer { height: 900px; }
  iframe { width: 100%; height: 90px; border: 1px dashed #cfdcdc; border-radius: 4px; }
  /* ---- 扩展操作的靶子 ---- */
  .box { display: inline-block; padding: 10px 16px; border: 1px dashed #9fb8bd;
         border-radius: 4px; background: #f0f7f8; font-size: 13px; }
  #hover-menu { display: none; margin-top: 6px; padding: 8px 12px; background: #16697A;
                color: #fff; border-radius: 4px; }
  #drop-target { min-width: 120px; background: #fdf4e6; border-color: #d98c1f; }
  #drop-target.dropped { background: #e8f6ef; border-color: #2e9e6b; color: #2e9e6b; }
  #dbl-box.done, #ctx-box.done { background: #e8f6ef; border-color: #2e9e6b; color: #2e9e6b; }
  .item { font-size: 13px; }
  #loading-box { margin-top: 6px; color: #d98c1f; font-size: 13px; }
  .echo { font-size: 13px; color: #16697A; margin-left: 8px; }
</style>
</head>
<body>

<h1>Web 测试演示页</h1>
<p class="hint">本页由后端静态托管（/api/demo/），专供自动化验收使用，不依赖任何外部资源。</p>

<div class="card">
  <div class="row">
    <label for="username">用户名</label>
    <input id="username" type="text" placeholder="请输入用户名">
  </div>
  <div class="row">
    <label for="password">密码</label>
    <input id="password" type="password" placeholder="请输入密码">
  </div>
  <button id="login-btn" type="button">登录</button>
  <div id="welcome"></div>
</div>

<div class="card">
  <div class="row">
    <label>状态</label>
    <span id="status">ready</span>
  </div>
  <div class="row">
    <label for="city">城市（用于「清空输入」）</label>
    <input id="city" type="text" value="北京">
  </div>
  <div id="hidden" style="display:none">这一块默认不可见，用于「断言-元素可见」的反例</div>
</div>

<div class="card">
  <div class="row">
    <label>IFrame</label>
    <iframe id="frame" srcdoc="&lt;html&gt;&lt;body style='font-family:sans-serif'&gt;&lt;div id='inner'&gt;iframe 内部文本&lt;/div&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
  </div>
  <div class="row">
    <label>新窗口</label>
    <a id="newlink" href="/api/demo/popup.html" target="_blank">打开新窗口</a>
  </div>
</div>

<!-- ==================== 扩展操作靶子 ==================== -->
<div class="card">
  <h2>扩展操作</h2>

  <div class="row">
    <label for="city-select">下拉框选择（原生 select）</label>
    <select id="city-select">
      <option value="">请选择</option>
      <option value="bj">北京</option>
      <option value="sh">上海</option>
      <option value="gz">广州</option>
    </select>
    <span id="city-echo" class="echo"></span>
  </div>

  <div class="row">
    <label for="search-key">键盘按键（输入后按回车）</label>
    <input id="search-key" type="text" placeholder="输入关键字后按回车" style="width:220px">
    <span id="search-echo" class="echo"></span>
  </div>

  <div class="row">
    <label for="upload">上传文件</label>
    <input id="upload" type="file">
    <span id="upload-echo" class="echo"></span>
  </div>

  <div class="row">
    <label>鼠标悬停</label>
    <div id="hover-box" class="box">鼠标移上来
      <div id="hover-menu">悬停后出现的内容</div>
    </div>
  </div>

  <div class="row">
    <label>双击 / 右键</label>
    <div id="dbl-box" class="box" style="margin-right:8px">双击我</div>
    <div id="ctx-box" class="box">右键我</div>
  </div>

  <div class="row">
    <label>拖拽（把左边拖到右边）</label>
    <div id="drag-src" class="box" draggable="true" style="margin-right:8px">拖动源</div>
    <div id="drop-target" class="box">放置目标</div>
  </div>

  <div class="row">
    <label>弹窗</label>
    <button id="alert-btn" type="button">alert</button>
    <button id="confirm-btn" type="button">confirm</button>
    <button id="prompt-btn" type="button">prompt</button>
    <span id="dialog-echo" class="echo"></span>
  </div>

  <div class="row">
    <label>等待元素消失</label>
    <button id="remove-btn" type="button">移除下面的 loading</button>
    <div id="loading-box">loading…</div>
  </div>

  <div class="row">
    <label>元素数量（3 个）与属性断言</label>
    <ul id="item-list">
      <li class="item">A</li>
      <li class="item">B</li>
      <li class="item">C</li>
    </ul>
    <input id="attr-field" type="text" placeholder="占位文本" disabled style="width:220px">
  </div>

  <div class="row">
    <label>滚动到底部</label>
    <span id="scroll-echo" class="echo">未检测</span>
  </div>

  <div class="row">
    <label>页面加载标记（用于验证「刷新页面」真的重新加载了）</label>
    <span id="reload-mark" class="echo">-</span>
  </div>
</div>

<div class="spacer">（下方留白，用于验证「滚动到元素」）</div>
<div id="bottom" class="card">页面底部（滚动目标）</div>

<script>
  // 全页唯一的动态行为：点登录按钮，把欢迎语写进 #welcome。
  // 验收脚本靠它验证 input → click → extract_variable 的链路。
  document.getElementById('login-btn').addEventListener('click', function () {
    var name = document.getElementById('username').value;
    document.getElementById('welcome').innerText = '欢迎 ' + name;
  });

  // ---------- 扩展操作：每个靶子都自带可见的状态回显，断言才有东西可断 ----------

  // 下拉框选择
  document.getElementById('city-select').addEventListener('change', function () {
    document.getElementById('city-echo').innerText = '已选：' + this.value;
  });

  // 键盘按键：回车触发
  document.getElementById('search-key').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      document.getElementById('search-echo').innerText = '已搜索：' + this.value;
    }
  });

  // 上传文件
  document.getElementById('upload').addEventListener('change', function () {
    document.getElementById('upload-echo').innerText =
      this.files.length ? '已选文件：' + this.files[0].name : '';
  });

  // 悬停：同时挂 CSS 与 JS（WebDriver 的鼠标移动会触发 mouseover）
  var hoverBox = document.getElementById('hover-box');
  hoverBox.addEventListener('mouseover', function () {
    document.getElementById('hover-menu').style.display = 'block';
  });

  // 双击 / 右键
  document.getElementById('dbl-box').addEventListener('dblclick', function () {
    this.classList.add('done');
    this.innerText = '已双击';
  });
  document.getElementById('ctx-box').addEventListener('contextmenu', function (e) {
    e.preventDefault();
    this.classList.add('done');
    this.innerText = '已右键';
  });

  // 拖拽：既接 HTML5 事件，也用鼠标事件兜底 ——
  // WebDriver 的 pointer 序列在不同 Chrome 版本上未必触发 HTML5 drag 事件，
  // 两条路都通，验收才不会偶发假失败。
  var dragSrc = document.getElementById('drag-src');
  var dropTarget = document.getElementById('drop-target');
  var mouseDragging = false;
  function markDropped() {
    dropTarget.classList.add('dropped');
    dropTarget.innerText = '已放置';
  }
  dragSrc.addEventListener('dragstart', function (e) {
    e.dataTransfer.setData('text/plain', 'src');
  });
  dropTarget.addEventListener('dragover', function (e) { e.preventDefault(); });
  dropTarget.addEventListener('drop', function (e) { e.preventDefault(); markDropped(); });
  dragSrc.addEventListener('mousedown', function () { mouseDragging = true; });
  document.addEventListener('mouseup', function () {
    setTimeout(function () { mouseDragging = false; }, 0);
  });
  dropTarget.addEventListener('mouseup', function () {
    if (mouseDragging) markDropped();
  });

  // 弹窗
  document.getElementById('alert-btn').addEventListener('click', function () {
    alert('这是一个 alert');
    document.getElementById('dialog-echo').innerText = 'alert 已关闭';
  });
  document.getElementById('confirm-btn').addEventListener('click', function () {
    var ok = confirm('这是一个 confirm');
    document.getElementById('dialog-echo').innerText = ok ? 'confirm 已确认' : 'confirm 已取消';
  });
  document.getElementById('prompt-btn').addEventListener('click', function () {
    var text = prompt('请输入点什么', '');
    document.getElementById('dialog-echo').innerText =
      text === null ? 'prompt 已取消' : 'prompt 输入：' + text;
  });

  // 等待元素消失
  document.getElementById('remove-btn').addEventListener('click', function () {
    document.getElementById('loading-box').remove();
  });

  // 滚动到底部：滚到接近底部时回显，供「滚动到页面底部」断言
  window.addEventListener('scroll', function () {
    var atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 40;
    if (atBottom) document.getElementById('scroll-echo').innerText = '已到达底部';
  });

  // 每次加载写一个新的时间戳：刷新前后取值不同，才能证明「刷新」真的重载了页面
  document.getElementById('reload-mark').innerText = 'load-' + Date.now();
</script>

</body>
</html>
